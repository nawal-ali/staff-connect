{% extends "base.html" %}
{% block title %}Edit profile - StaffConnect{% endblock %}
{% block content %}
<div class="card">
    <h1>Edit profile</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Save changes</button>
        <a href="{% url 'profile' %}">Cancel</a>
    </form>
</div>
{% endblock %}
