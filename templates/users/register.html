{% extends "base.html" %}
{% block title %}Register - StaffConnect{% endblock %}
{% block content %}
<div class="card">
    <h1>Create your account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
