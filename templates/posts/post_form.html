{% extends "base.html" %}
{% block title %}{% if object %}Edit announcement{% else %}New announcement{% endif %} - StaffConnect{% endblock %}
{% block content %}
<div class="card">
    <h1>{% if object %}Edit announcement{% else %}New announcement{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Save</button>
        <a href="{% url 'home' %}">Cancel</a>
    </form>
</div>
{% endblock %}
